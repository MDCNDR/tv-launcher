name: Build APK

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E -A3 "error:|e: |What went wrong|Could not|Duplicate class|Cannot find|FAILED" build.log \
            | grep -v -E "^\s*at |> Task .* (UP-TO-DATE|NO-SOURCE)$|^--$" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done

      - name: Rename APK and write version.json
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk
          echo "{\"versionCode\": $((10 + GITHUB_RUN_NUMBER)), \"versionName\": \"1.3.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher
          path: tv-launcher.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-launcher.apk version.json --title "TV Launcher (build ${{ github.run_number }})" --notes "Commit ${{ github.sha }}"
