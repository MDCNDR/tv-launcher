plugins {
    id 'com.android.application'
}

// Номер версии = номер сборки в GitHub Actions (+10, чтобы быть выше ранних ручных версий).
// Та же формула в .github/workflows/build.yml для version.json.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as Integer

android {
    namespace 'ru.my.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.my.tvlauncher'
        minSdk 26
        targetSdk 34
        versionCode 10 + runNumber
        versionName "1.3.${runNumber}"
    }

    // Постоянный ключ подписи: обновления ставятся поверх без удаления.
    signingConfigs {
        launcher {
            storeFile rootProject.file('keystore/launcher.jks')
            storePassword 'android'
            keyAlias 'launcher'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.launcher
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.launcher
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // У зависимостей dadb одинаковые файлы лицензий в META-INF — в APK они не нужны.
    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module', 'META-INF/versions/9/previous-compilation-data.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ADB-клиент для подключения к отладке по сети на самой приставке (без root).
    implementation 'dev.mobile:dadb:1.2.9'
    // Одна версия всех модулей Kotlin, которые тянет dadb.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
}
