plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.my.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.my.tvlauncher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Постоянный ключ подписи: обновления ставятся поверх без удаления.
    signingConfigs {
        launcher {
            storeFile rootProject.file('keystore/launcher.jks')
            storePassword 'android'
            keyAlias 'launcher'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.launcher
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.launcher
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
